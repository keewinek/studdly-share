name: Test & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check Cloudflare token
        id: check
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN not set — skipping deploy."
          fi
      - uses: actions/checkout@v5
        if: steps.check.outputs.configured == 'true'
      - uses: actions/setup-node@v5
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.check.outputs.configured == 'true'
        run: npm ci
      - name: Ensure D1 databases
        if: steps.check.outputs.configured == 'true'
        run: node scripts/ensure-d1.mjs
      - name: Ensure workers.dev subdomain (needed for cron triggers)
        if: steps.check.outputs.configured == 'true'
        run: node scripts/ensure-workers-subdomain.mjs
      - name: Apply migrations
        if: steps.check.outputs.configured == 'true'
        run: |
          npx wrangler d1 migrations apply DB --remote
          npx wrangler d1 migrations apply PAYLOADS_1 --remote
      - name: Deploy Worker
        if: steps.check.outputs.configured == 'true'
        run: npx wrangler deploy --var GIT_SHA:${{ github.sha }}
      - name: Sync secrets
        if: steps.check.outputs.configured == 'true'
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          DISCORD_MODERATION_WEBHOOK: ${{ secrets.DISCORD_MODERATION_WEBHOOK }}
          DISCORD_STATS_WEBHOOK: ${{ secrets.DISCORD_STATS_WEBHOOK }}
        run: node scripts/sync-secrets.mjs
      - name: Smoke test
        if: steps.check.outputs.configured == 'true'
        run: |
          for i in $(seq 1 20); do
            if curl -fsS https://share.studdly.app/api/v1/health | grep -q '"ok":true'; then
              echo "share.studdly.app is healthy"; exit 0
            fi
            sleep 15
          done
          echo "::warning::share.studdly.app did not answer yet (a new custom domain certificate can take a few minutes)."
